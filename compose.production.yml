services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/biqxx/limitra-fe:main}
    container_name: limitra-frontend
    restart: unless-stopped
    init: true
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      platform_edge:
        aliases:
          - limitra-frontend
    stop_grace_period: 30s

networks:
  platform_edge:
    external: true
