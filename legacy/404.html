<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page Not Found, Limitra</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--bg); padding: 24px; }
  .err-wrap { max-width: 480px; text-align: center; }
  .err-logo { height: 30px; margin: 0 auto 36px; display: block; }
  .err-code { font-family: var(--font-display); font-weight: 700; font-size: clamp(96px, 22vw, 168px); line-height: .9; letter-spacing: -.04em; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .err-wrap h1 { font-size: 26px; margin: 6px 0 10px; }
  .err-wrap p { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; text-wrap: pretty; }
  .err-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .err-links { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; gap: 8px 20px; justify-content: center; flex-wrap: wrap; }
  .err-links a { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--text-muted); cursor: pointer; }
  .err-links a:hover { color: var(--primary); }
</style>
</head>
<body>
<div class="err-wrap">
  <img class="err-logo" src="assets/logo.png" alt="Limitra" />
  <div class="err-code">404</div>
  <h1>We can’t find that page</h1>
  <p>The page you’re looking for may have been moved, removed, or the link might be broken. Let’s get you back to shopping.</p>
  <div class="err-actions">
    <a class="btn btn-primary btn-lg" href="index.html">Back to store</a>
    <a class="btn btn-outline btn-lg" href="index.html#/shop/all">Browse products</a>
  </div>
  <div class="err-links">
    <a href="index.html#/shop/all">Shop</a>
    <a href="index.html#/help">Help center</a>
    <a href="index.html#/help/contact">Contact us</a>
    <a href="index.html#/account">My account</a>
  </div>
</div>
</body>
</html>
