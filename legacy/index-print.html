<style>
  /* ---- Print-ready overrides ---- */
  @page { size: portrait; margin: 1cm; }

  @media print {
    html, body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      background: #fff !important;
    }

    /* flatten sticky/fixed chrome so it doesn't repeat or overlap */
    .site-head { position: static !important; box-shadow: none !important; }
    .site-head::after { display: none !important; }

    /* the ambient fixed glow would tile on every page */
    body::before { display: none !important; }

    /* hide purely-interactive elements that make no sense on paper */
    .lucy-fab, .lucy-panel, .lucy-pulse,
    .mob-bottom, .mob-search, .hamb,
    .tweaks-host, .toasts, .toast,
    .hero-nav, .hero-arrow, .hero-dots,
    .mini-cart, .mini-cart-overlay, .mobile-menu, .mobile-menu-overlay,
    .search-modal-overlay {
      display: none !important;
    }

    /* kill motion + hover lift so captures are crisp and static */
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }

    /* avoid clipping content across page edges */
    .wrap, .page, .app-main { overflow: visible !important; }

    /* keep cohesive blocks together where possible */
    .pcard, .cat-tile, .flash-band, .hero, .testimonial, .why-card,
    .help-cat, .aff-perk, .aff-tier, .promo-card, .stat-card {
      break-inside: avoid;
    }

    /* give major sections a little breathing room */
    section, .sec { break-inside: avoid-page; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Auto-print once the app has mounted and fonts are ready -->
<script>
  (function () {
    var printed = false;
    function appReady() {
      return document.querySelector('.hero-carousel') ||
             document.querySelector('.app-main') ||
             (document.getElementById('root') && document.getElementById('root').children.length > 0);
    }
    function fire() {
      if (printed) return; printed = true;
      setTimeout(function () { window.print(); }, 600);
    }
    function start() {
      var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      Promise.resolve(fontsReady).then(function () {
        var tries = 0;
        (function wait() {
          if (appReady() || tries > 60) fire();
          else { tries++; setTimeout(wait, 150); }
        })();
      });
    }
    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start);
  })();
</script>
</body>
