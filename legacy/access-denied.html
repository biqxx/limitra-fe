<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Access Denied, Limitra</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--bg); padding: 24px; }
  .ad-card { max-width: 440px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 44px 36px; box-shadow: var(--shadow-lg); }
  .ad-ic { width: 72px; height: 72px; border-radius: 50%; background: rgba(229,72,77,.12); color: var(--red); display: grid; place-items: center; margin: 0 auto 22px; }
  .ad-card h1 { font-size: 26px; margin-bottom: 10px; }
  .ad-card p { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 26px; text-wrap: pretty; }
  .ad-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .ad-logo { height: 30px; margin: 0 auto 28px; display: block; }
</style>
</head>
<body>
<div class="ad-card">
  <img class="ad-logo" src="assets/logo.png" alt="Limitra" />
  <div class="ad-ic">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3"/></svg>
  </div>
  <h1>Access denied</h1>
  <p id="ad-msg">You don’t have permission to view this dashboard. Please sign in with an account that has the right access.</p>
  <div class="ad-actions">
    <a class="btn btn-primary btn-lg" href="index.html#/auth/signin">Sign in</a>
    <a class="btn btn-outline btn-lg" href="index.html">Back to store</a>
  </div>
</div>
<script>
  (function () {
    var need = new URLSearchParams(location.search).get('need');
    var msg = document.getElementById('ad-msg');
    if (need === 'admin') msg.textContent = 'This area is restricted to administrators. Sign in with a Super Admin account to continue.';
    else if (need === 'affiliate') msg.textContent = 'This area is for Limitra affiliates. Sign in with an approved affiliate account, or join the affiliate programme to get access.';
  })();
</script>
</body>
</html>
